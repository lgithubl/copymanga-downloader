name: Interactive Web Image

on:
  workflow_run:
    workflows:
      - Build Web Docker Image
    types:
      - completed
  workflow_dispatch:
    inputs:
      image:
        description: Docker image to run
        required: true
        default: ghcr.io/lgithubl/copymanga-downloader:web
      media_stream_image:
        description: Media stream widget image to run
        required: true
        default: ghcr.io/lgithubl/media-stream-widget:latest
      minutes:
        description: Minutes to keep the page alive
        required: true
        default: "60"

permissions:
  contents: read
  packages: read

jobs:
  interactive:
    name: Start temporary web session
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          IMAGE="${{ inputs.image }}"
          if [ -z "$IMAGE" ]; then IMAGE="ghcr.io/lgithubl/copymanga-downloader:web"; fi
          docker pull "$IMAGE"
          MEDIA_IMAGE="${{ inputs.media_stream_image }}"
          if [ -z "$MEDIA_IMAGE" ]; then MEDIA_IMAGE="ghcr.io/lgithubl/media-stream-widget:latest"; fi
          docker pull "$MEDIA_IMAGE"

      - name: Start copymanga web
        run: |
          mkdir -p "$RUNNER_TEMP/copymanga-data/library/media" "$RUNNER_TEMP/copymanga-input"
          # anidb-v1 的配置项一律没有默认值（没配就 failed），这里先按 mock 预置一份，
          # 省得每次起会话都要从零填。要打真实 AniDB 只需改 apiBaseUrl 和 apiClient。
          # 预置 dump：没有它 anidb-v1 一上来就失败，会话里还得先手点一次「刷新 AniDB dump」。
          # 拉不到不算致命（AniDB 可能挡云端 IP），页面上那个按钮仍可重试。
          # 和构建产物一样要验内容：被挡时 AniDB 回的是 200 的 HTML，不验就会存下一份假 dump。
          mkdir -p "$RUNNER_TEMP/copymanga-data/cache/anidb"
          if curl -fsSL --max-time 180 -A "copymanga-downloader/ci" \
               https://anidb.net/api/anime-titles.xml.gz \
               -o "$RUNNER_TEMP/copymanga-data/cache/anidb/anime-titles.xml.gz"; then
            COUNT="$(gzip -dc "$RUNNER_TEMP/copymanga-data/cache/anidb/anime-titles.xml.gz" | grep -c '<anime aid=' || true)"
            if [ "${COUNT:-0}" -ge 1000 ]; then
              printf '{"animeCount":%s,"fetchedAt":"%s"}\n' "$COUNT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                > "$RUNNER_TEMP/copymanga-data/cache/anidb/anime-titles.meta.json"
              echo "dump 预置完成：$COUNT 部"
            else
              echo "dump 内容不可信（$COUNT 条），删掉，交给页面按钮重试"
              rm -f "$RUNNER_TEMP/copymanga-data/cache/anidb/anime-titles.xml.gz"
            fi
          else
            echo "dump 预置失败，交给页面上的「刷新 AniDB dump」按钮"
          fi
          mkdir -p "$RUNNER_TEMP/copymanga-data/cache/library/tag-script-config"
          cat >"$RUNNER_TEMP/copymanga-data/cache/library/tag-script-config/anidb-v1.json" <<'JSON'
          {
            "scriptId": "anidb-v1",
            "options": {
              "dumpDir": "/data/cache/anidb",
              "matchThreshold": 0.85,
              "force": false,
              "apiEnabled": true,
              "apiBaseUrl": "http://mock-anidb:11596/httpapi",
              "apiClient": "mockclient",
              "apiClientVer": "1",
              "apiCacheDir": "/data/cache/anidb-api",
              "apiSleepBaseMs": 200,
              "apiSleepJitterMs": 300,
              "apiTimeoutMs": 8000,
              "scriptTimeoutMs": 600000
            }
          }
          JSON
          cat >"$RUNNER_TEMP/copymanga-data/config.json" <<'JSON'
          {
            "mediaStreamApiBase": "/media-stream",
            "mediaManagedBasePath": "/data/library/media",
            "mediaStreamBasePath": "/media",
            "mediaImportSourceRoots": "/input"
          }
          JSON
          IMAGE="${{ inputs.image }}"
          if [ -z "$IMAGE" ]; then IMAGE="ghcr.io/lgithubl/copymanga-downloader:web"; fi
          MEDIA_IMAGE="${{ inputs.media_stream_image }}"
          if [ -z "$MEDIA_IMAGE" ]; then MEDIA_IMAGE="ghcr.io/lgithubl/media-stream-widget:latest"; fi
          cat >/tmp/mock_asr.py <<'PY'
          import json
          import os
          import pathlib
          import http.server

          DATA_DIR = pathlib.Path(os.environ["COPYMANGA_DATA_DIR"])

          class Handler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def _json(self, status, payload):
                  body = json.dumps(payload).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/health":
                      self._json(200, {"ok": True})
                      return
                  self._json(404, {"error": "not found"})

              def do_POST(self):
                  if self.path != "/v1/subtitles":
                      self._json(404, {"error": "not found"})
                      return
                  length = int(self.headers.get("Content-Length") or 0)
                  payload = json.loads(self.rfile.read(length) or b"{}")
                  output_dir = str(payload.get("output_dir") or "media").strip("/").replace("..", "_")
                  output_key = str(payload.get("uniq_key_name") or "mock.ja.srt").split("/")[-1].replace("..", "_")
                  target_dir = DATA_DIR / "library" / "media" / "media" / output_dir / "files" / "ai-subtitles"
                  target_dir.mkdir(parents=True, exist_ok=True)
                  target = target_dir / output_key
                  target.write_text("1\n00:00:00,000 --> 00:00:01,500\nmock ai subtitle\n", encoding="utf-8")
                  self._json(200, {
                      "ok": True,
                      "accepted": False,
                      "async": False,
                      "output_key": output_key,
                      "output_path": f"/outputs/{output_key}",
                      "segments": 1,
                      "tmp_path": f"/outputs/{output_key}.tmp",
                      "err_log_path": f"/outputs/{output_key}.err.log",
                  })

          http.server.ThreadingHTTPServer(("0.0.0.0", 11594), Handler).serve_forever()
          PY
          cat >/tmp/mock_llm.py <<'PY'
          import json
          import http.server

          class Handler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def _json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/health":
                      self._json(200, {"ok": True})
                      return
                  self._json(404, {"error": "not found"})

              def do_POST(self):
                  if self.path != "/v1/chat/completions":
                      self._json(404, {"error": "not found"})
                      return
                  length = int(self.headers.get("Content-Length") or 0)
                  payload = json.loads(self.rfile.read(length) or b"{}")
                  content = payload.get("messages", [{}])[-1].get("content", "")
                  translated = "\n".join(
                      "mock zh subtitle" if line and "-->" not in line and not line.isdigit() and not line.startswith("将下面") else line
                      for line in content.splitlines()
                  ).strip()
                  self._json(200, {
                      "id": "mock-llm",
                      "object": "chat.completion",
                      "choices": [{"index": 0, "message": {"role": "assistant", "content": translated}, "finish_reason": "stop"}],
                  })

          http.server.ThreadingHTTPServer(("0.0.0.0", 11595), Handler).serve_forever()
          PY
          # AniDB httpapi 的替身。dump 匹配用不到它，但「调详情接口」这条分支
          # 不挂替身就只能把 apiEnabled 关掉，等于永远测不到。
          # 真实地址由使用者自行在脚本配置里改 apiBaseUrl，这里绝不指向 anidb.net。
          cat >/tmp/mock_anidb.py <<'PY'
          import http.server
          import time
          import urllib.parse

          OK = '''<?xml version="1.0" encoding="UTF-8"?><anime id="{aid}" restricted="true">
          <type>OVA</type><episodecount>2</episodecount>
          <startdate>2022-02-04</startdate><enddate>2022-02-04</enddate>
          <titles><title type="main" xml:lang="x-jat">Mock Title {aid}</title></titles>
          <tags><tag id="1"><name>drama</name></tag><tag id="2"><name>mock tag</name></tag></tags>
          </anime>'''

          class Handler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, *a):
                  pass

              def do_GET(self):
                  try:
                      self._handle()
                  except (BrokenPipeError, ConnectionResetError):
                      pass

              def _send(self, status, body, ctype="text/xml; charset=utf-8"):
                  data = body.encode()
                  self.send_response(status)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

              def _handle(self):
                  parsed = urllib.parse.urlparse(self.path)
                  q = urllib.parse.parse_qs(parsed.query)
                  aid = (q.get("aid") or ["0"])[0]
                  client = (q.get("client") or [""])[0]
                  if parsed.path == "/health":
                      self._send(200, '{"ok":true}', "application/json")
                      return
                  # 失败模式用路径后缀选：查询串会被脚本自己拼的 ?request=anime 污染
                  mode = parsed.path.rsplit("/", 1)[-1]
                  if mode == "error":
                      self._send(200, '<error code="330">no such anime</error>')
                      return
                  if mode == "notanime":
                      self._send(200, '<?xml version="1.0"?><something/>')
                      return
                  if mode == "http500":
                      self._send(500, "boom", "text/plain")
                      return
                  if not client:
                      self._send(200, '<error code="302">client version missing or invalid</error>')
                      return
                  if aid == "999001":
                      self._send(200, '<error code="330">no such anime</error>')
                      return
                  if aid == "999002":
                      time.sleep(30)
                  if aid == "999003":
                      self._send(500, "boom", "text/plain")
                      return
                  self._send(200, OK.format(aid=aid))

          http.server.ThreadingHTTPServer(("0.0.0.0", 11596), Handler).serve_forever()
          PY
          docker network create copymanga-action-net
          SCRIPT_CONTAINER="$(docker create "$IMAGE")"
          docker cp "$SCRIPT_CONTAINER:/opt/copymanga/tag-scripts" "$RUNNER_TEMP/copymanga-data/tag-scripts" || true
          docker rm "$SCRIPT_CONTAINER"
          docker run -d --name mock-asr \
            --network copymanga-action-net \
            -p 11594:11594 \
            -e COPYMANGA_DATA_DIR=/data \
            -v "$RUNNER_TEMP/copymanga-data:/data" \
            -v /tmp/mock_asr.py:/mock_asr.py:ro \
            python:3-alpine python /mock_asr.py
          docker run -d --name mock-llm \
            --network copymanga-action-net \
            -p 11595:11595 \
            -v /tmp/mock_llm.py:/mock_llm.py:ro \
            python:3-alpine python /mock_llm.py
          docker run -d --name mock-anidb \
            --network copymanga-action-net \
            -p 11596:11596 \
            -v /tmp/mock_anidb.py:/mock_anidb.py:ro \
            python:3-alpine python /mock_anidb.py
          docker run -d --name media-stream-widget \
            --network copymanga-action-net \
            -p 8081:8080 \
            -v "$RUNNER_TEMP/copymanga-data/library/media:/media:ro" \
            "$MEDIA_IMAGE"
          docker run -d --name copymanga-web \
            --network copymanga-action-net \
            -p 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            -v "$RUNNER_TEMP/copymanga-data:/data" \
            -v "$RUNNER_TEMP/copymanga-input:/input" \
            "$IMAGE"

      - name: Wait for app
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null && curl -fsS http://127.0.0.1:8081/health >/dev/null && curl -fsS http://127.0.0.1:11594/health >/dev/null && curl -fsS http://127.0.0.1:11595/health >/dev/null; then
              exit 0
            fi
            docker logs --tail 80 copymanga-web || true
            docker logs --tail 80 media-stream-widget || true
            docker logs --tail 80 mock-asr || true
            docker logs --tail 80 mock-llm || true
            docker logs --tail 80 mock-anidb || true
            sleep 2
          done
          docker logs copymanga-web || true
          docker logs media-stream-widget || true
          docker logs mock-asr || true
          docker logs mock-llm || true
          exit 1

      - name: HTTP smoke test
        run: |
          check() {
            name="$1"
            shift
            echo "checking: $name"
            "$@"
          }
          check "copymanga health" sh -c "curl -fsS http://127.0.0.1:8080/health | grep -Eq '\"ok\"[[:space:]]*:[[:space:]]*true'"
          if ! curl -fsS http://127.0.0.1:8081/health >/dev/null; then
            echo "media-stream health check failed after wait step; keeping interactive page available"
            docker logs --tail 120 media-stream-widget || true
          fi
          check "mock asr health" sh -c "curl -fsS http://127.0.0.1:11594/health | grep -Eq '\"ok\"[[:space:]]*:[[:space:]]*true'"
          check "mock llm health" sh -c "curl -fsS http://127.0.0.1:11595/health | grep -Eq '\"ok\"[[:space:]]*:[[:space:]]*true'"
          check "mock anidb health" sh -c "curl -fsS http://127.0.0.1:11596/health | grep -Eq '\"ok\"[[:space:]]*:[[:space:]]*true'"
          check "mock anidb xml" sh -c "curl -fsS 'http://127.0.0.1:11596/httpapi?request=anime&client=mockclient&aid=16913' | grep -q '<anime'"
          check "index html" sh -c "curl -fsS http://127.0.0.1:8080/ | grep -q '拷贝漫画下载器'"
          check "jobs api" sh -c "curl -fsS http://127.0.0.1:8080/api/jobs | grep -q '^\['"
          check "downloaded api" sh -c "curl -fsS http://127.0.0.1:8080/api/downloaded | grep -q '^\['"
          check "config api" sh -c "curl -fsS http://127.0.0.1:8080/api/config | grep -q '\"/media-stream\"'"

      - name: Start authenticated proxy
        id: auth
        shell: bash
        run: |
          USERNAME="copymanga"
          PASSWORD="$(openssl rand -base64 18 | tr -d '=+/')"
          {
            echo "username=$USERNAME"
            echo "password=$PASSWORD"
          } >> "$GITHUB_OUTPUT"
          cat >/tmp/basic_proxy.py <<'PY'
          import base64
          import http.server
          import os
          import urllib.error
          import urllib.request

          TARGET = "http://127.0.0.1:8080"
          STREAM_TARGET = "http://127.0.0.1:8081"
          STREAM_PREFIX = "/media-stream"
          USERNAME = os.environ["BASIC_USER"]
          PASSWORD = os.environ["BASIC_PASS"]
          EXPECTED = "Basic " + base64.b64encode(f"{USERNAME}:{PASSWORD}".encode()).decode()
          HOP_BY_HOP = {"connection", "keep-alive", "proxy-authenticate", "proxy-authorization", "te", "trailers", "transfer-encoding", "upgrade"}

          class Proxy(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def _unauthorized(self):
                  body = b"Authentication required\n"
                  self.send_response(401)
                  self.send_header("WWW-Authenticate", 'Basic realm="copymanga-web"')
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def _proxy(self):
                  if self.headers.get("Authorization") != EXPECTED:
                      self._unauthorized()
                      return
                  length = int(self.headers.get("Content-Length") or 0)
                  body = self.rfile.read(length) if length else None
                  headers = {
                      k: v for k, v in self.headers.items()
                      if k.lower() not in HOP_BY_HOP and k.lower() != "host"
                  }
                  headers.pop("Authorization", None)
                  target = TARGET
                  request_path = self.path
                  if self.path == STREAM_PREFIX:
                      target = STREAM_TARGET
                      request_path = "/"
                  elif self.path.startswith(STREAM_PREFIX + "/"):
                      target = STREAM_TARGET
                      request_path = self.path[len(STREAM_PREFIX):]
                  req = urllib.request.Request(
                      target + request_path,
                      data=body,
                      headers=headers,
                      method=self.command,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=300) as resp:
                          self.send_response(resp.status)
                          is_stream = request_path.startswith("/api/stream/") or self.path.startswith("/api/events") or resp.headers.get("Content-Type", "").startswith("text/event-stream")
                          if is_stream:
                              self.close_connection = True
                              for k, v in resp.headers.items():
                                  if k.lower() not in HOP_BY_HOP:
                                      self.send_header(k, v)
                              self.send_header("Connection", "close")
                              self.end_headers()
                              while True:
                                  chunk = resp.read(1024 * 256)
                                  if not chunk:
                                      break
                                  self.wfile.write(chunk)
                                  self.wfile.flush()
                          else:
                              payload = resp.read()
                              for k, v in resp.headers.items():
                                  if k.lower() not in HOP_BY_HOP and k.lower() != "content-length":
                                      self.send_header(k, v)
                              self.send_header("Content-Length", str(len(payload)))
                              self.end_headers()
                              self.wfile.write(payload)
                  except urllib.error.HTTPError as exc:
                      payload = exc.read()
                      self.send_response(exc.code)
                      for k, v in exc.headers.items():
                          if k.lower() not in HOP_BY_HOP and k.lower() != "content-length":
                              self.send_header(k, v)
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)

              def do_GET(self): self._proxy()
              def do_HEAD(self): self._proxy()
              def do_POST(self): self._proxy()
              def do_PUT(self): self._proxy()
              def do_PATCH(self): self._proxy()
              def do_DELETE(self): self._proxy()

          http.server.ThreadingHTTPServer(("127.0.0.1", 8090), Proxy).serve_forever()
          PY
          BASIC_USER="$USERNAME" BASIC_PASS="$PASSWORD" python /tmp/basic_proxy.py >/tmp/basic_proxy.log 2>&1 &
          echo $! >/tmp/basic_proxy.pid
          sleep 1
          curl -fsS -u "$USERNAME:$PASSWORD" http://127.0.0.1:8090/health >/dev/null
          curl -fsS -u "$USERNAME:$PASSWORD" http://127.0.0.1:8090/media-stream/health >/dev/null

      - name: Start Cloudflare quick tunnel
        id: tunnel
        shell: bash
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:8090 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          for i in $(seq 1 60); do
            URL="$(grep -oE 'https://[-a-zA-Z0-9.]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              {
                echo "## Temporary copymanga web page"
                echo
                echo "URL: $URL"
                echo
                echo "Username: \`${{ steps.auth.outputs.username }}\`"
                echo
                echo "Password: \`${{ steps.auth.outputs.password }}\`"
                echo
                MINUTES="${{ inputs.minutes }}"
                if [ -z "$MINUTES" ]; then MINUTES="60"; fi
                echo "This runner will stay alive for ${MINUTES} minutes unless cancelled."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Temporary URL::$URL"
              {
                echo "URL=$URL"
                echo "USERNAME=${{ steps.auth.outputs.username }}"
                echo "PASSWORD=${{ steps.auth.outputs.password }}"
              } > "$RUNNER_TEMP/copymanga-web-connection-info.txt"
              exit 0
            fi
            cat /tmp/cloudflared.log || true
            sleep 2
          done
          cat /tmp/cloudflared.log || true
          exit 1

      - name: Upload connection info
        uses: actions/upload-artifact@v6
        with:
          name: copymanga-web-connection-info
          path: ${{ runner.temp }}/copymanga-web-connection-info.txt
          if-no-files-found: error
          retention-days: 1

      - name: Keep session alive
        run: |
          MINUTES="${{ inputs.minutes }}"
          if [ -z "$MINUTES" ]; then MINUTES="60"; fi
          echo "Open this URL:"
          echo "${{ steps.tunnel.outputs.url }}"
          echo
          echo "Basic Auth username: ${{ steps.auth.outputs.username }}"
          echo "Basic Auth password: ${{ steps.auth.outputs.password }}"
          echo
          echo "Keeping session alive for ${MINUTES} minutes..."
          sleep "$(( MINUTES * 60 ))"

      - name: Collect logs
        if: always()
        run: |
          docker logs copymanga-web >/tmp/copymanga-web-container.log 2>&1 || true
          docker logs media-stream-widget >/tmp/media-stream-widget-container.log 2>&1 || true
          docker logs mock-asr >/tmp/mock-asr.log.copy 2>&1 || true
          docker logs mock-llm >/tmp/mock-llm.log.copy 2>&1 || true
          docker logs mock-anidb >/tmp/mock-anidb.log.copy 2>&1 || true
          cp /tmp/cloudflared.log /tmp/cloudflared.log.copy 2>/dev/null || true
          cp /tmp/basic_proxy.log /tmp/basic_proxy.log.copy 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: copymanga-web-interactive-logs
          path: |
            /tmp/copymanga-web-container.log
            /tmp/media-stream-widget-container.log
            /tmp/mock-asr.log.copy
            /tmp/mock-llm.log.copy
            /tmp/mock-anidb.log.copy
            /tmp/cloudflared.log.copy
            /tmp/basic_proxy.log.copy
          if-no-files-found: warn
          retention-days: 3
