name: Build Web Docker Image

on:
  push:
    branches:
      - main
      - windows-portable-build
    paths:
      - "web/**"
      - "scripts/tag-scripts/**"
      - "Dockerfile.web"
      - ".dockerignore"
      - ".github/workflows/build-web-image.yml"
      - ".github/workflows/interactive-web-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: false
        default: web
      export_artifact:
        description: Export image tar.gz artifact
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  packages: write

jobs:
  build-web-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="web"; fi
          IMAGE="ghcr.io/${{ github.repository }}:${TAG}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=copymanga-downloader-web-${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.image.outputs.image }}

      - name: Smoke test pushed image
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.image }}"
          docker run -d --name copymanga-web-smoke -p 8080:8080 "${{ steps.image.outputs.image }}"
          for i in $(seq 1 60); do
            HEALTH="$(curl -fsS http://127.0.0.1:8080/health 2>/dev/null || true)"
            if grep -q '"ok":true' <<<"$HEALTH"; then
              # 先落到变量/文件再 grep：`curl | grep -q` 里 grep 匹配到就提前退出，curl 还在写时会报 23（Failure writing output），
              # 在 pipefail 下整步失败。首页变大（超过管道缓冲）之后这是必现的坑。
              INDEX="$(curl -fsS http://127.0.0.1:8080/)"
              grep -q '拷贝漫画下载器' <<<"$INDEX"
              JOBS="$(curl -fsS http://127.0.0.1:8080/api/jobs)"
              grep -q '^\[' <<<"$JOBS"
              DOWNLOADED="$(curl -fsS http://127.0.0.1:8080/api/downloaded)"
              grep -q '^\[' <<<"$DOWNLOADED"
              docker rm -f copymanga-web-smoke
              exit 0
            fi
            docker logs --tail 80 copymanga-web-smoke || true
            sleep 2
          done
          docker logs copymanga-web-smoke || true
          docker rm -f copymanga-web-smoke || true
          exit 1

      - name: Export image tarball
        if: ${{ github.event_name == 'push' || inputs.export_artifact == 'true' }}
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.image }}"
          docker save "${{ steps.image.outputs.image }}" | gzip -1 > "${{ steps.image.outputs.artifact_name }}.tar.gz"

      - name: Package tag scripts
        if: ${{ github.event_name == 'push' || inputs.export_artifact == 'true' }}
        shell: bash
        run: |
          tar -C scripts -czf "${{ steps.image.outputs.artifact_name }}-tag-scripts.tar.gz" tag-scripts

      # anidb-v1 要一份标题 dump 才能匹配。这里现拉而不是把 1.8MB 的 gz 提进仓库：
      # 那是 AniDB 的数据集，不该由本仓库转发，而且提进去就会一直陈旧下去。
      # AniDB 可能挡云端 IP，所以整步失败也不许拖垮镜像构建——拿不到就不传这个产物。
      - name: Package AniDB dump
        id: dump
        if: ${{ github.event_name == 'push' || inputs.export_artifact == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p anidb-dump
          curl -fsSL --max-time 180 -A "copymanga-downloader/ci" \
            https://anidb.net/api/anime-titles.xml.gz -o anidb-dump/anime-titles.xml.gz
          # 必须验内容：AniDB 挡访问时会回一个 200 的 HTML 页面，直接存下来
          # 就是一份「看起来成功」的垃圾 dump，用的时候才炸。
          COUNT="$(gzip -dc anidb-dump/anime-titles.xml.gz | grep -c '<anime aid=' || true)"
          if [ "${COUNT:-0}" -lt 1000 ]; then
            echo "dump 内容不可信（只解出 ${COUNT:-0} 条 <anime aid=>），放弃打包"
            exit 1
          fi
          printf '{"animeCount":%s,"fetchedAt":"%s","source":"https://anidb.net/api/anime-titles.xml.gz"}\n' \
            "$COUNT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > anidb-dump/anime-titles.meta.json
          tar -czf "${{ steps.image.outputs.artifact_name }}-anidb-dump.tar.gz" -C anidb-dump .
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "✅ dump 打包完成，$COUNT 部"

      - name: Publish build artifacts to a release
        if: ${{ github.event_name == 'push' || inputs.export_artifact == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="web"; fi
          RELEASE_TAG="build-${TAG}"
          ASSETS=("${{ steps.image.outputs.artifact_name }}.tar.gz" "${{ steps.image.outputs.artifact_name }}-tag-scripts.tar.gz")
          if [ "${{ steps.dump.outcome }}" = "success" ]; then
            ASSETS+=("${{ steps.image.outputs.artifact_name }}-anidb-dump.tar.gz")
          fi
          # Release assets 不占 Actions/Packages 那份共享存储配额，artifact 之前
          # 老是把配额打满，挪到这里是治本而不是治标（配额是按月累计的 GB 小时，
          # 删旧 artifact 对已经超的部分没用，只能等下个计费周期）。
          # 用固定 tag 滚动覆盖，不然每次构建都新开一个 release 迟早把 Releases 页面刷屏。
          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" \
              --title "Web build artifacts ($TAG)" \
              --notes "由 build-web-image.yml 自动发布，每次构建覆盖最新产物，不代表某个固定版本。镜像另见 ${{ steps.image.outputs.image }}。"
          fi
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber
