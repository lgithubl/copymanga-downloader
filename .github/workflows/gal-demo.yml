name: Gal Interactive Demo

# Gal 的临时演示站点：起一个 web 容器（HTTP）→ 生成合成的演示数据（没有任何原作内容）→ 把各个游戏的演示导入进媒体库 → 开 Cloudflare 快速隧道，
# 在 job 摘要 / commit 评论里给出 URL，你直接在浏览器里看。比 archive-gallery-demo 轻：没有 LANraragi / Redis / 压力数据，只做 Gal。
# 演示里有：UViewer、monmusu、tenkeiprdx、minashigo、legeclo、girlscreation 各一个，和 maid 式的演示（首页「表情」入口 + 混合模式开关）。
# 镜像默认用 build-web-image 在这个分支上构建的那个标签；要试别的版本就改 image。
on:
  # 新工作流文件只在特性分支上时，workflow_dispatch 的 API 会 404（只认默认分支上已有的）：这个分支上改这个文件就直接跑一次（用默认输入）；合并到默认分支后手动触发也可以
  push:
    branches:
      - vibe-test-20261008
    paths:
      - ".github/workflows/gal-demo.yml"
  workflow_dispatch:
    inputs:
      image:
        description: copymanga-downloader 镜像
        required: true
        default: ghcr.io/lgithubl/copymanga-downloader:vibe-test-20261008
      minutes:
        description: 保持在线的分钟数
        required: true
        default: "60"

permissions:
  contents: write
  packages: read

jobs:
  demo:
    name: Gal demo
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout (fixtures + scripts)
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "${{ inputs.image || 'ghcr.io/lgithubl/copymanga-downloader:vibe-test-20261008' }}"

      - name: Generate synthetic Gal demo data
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/data/gal"
          # 一个目录 = 一个 Gal 媒体（目录原地使用，不 mv）。全是合成的：ImageMagick 画的色块、手写的最小 Spine 骨架
          node scripts/dev/make-gal-fixture.mjs "$RUNNER_TEMP/data/gal/UViewer演示"
          node scripts/dev/make-gal-games-fixture.mjs "$RUNNER_TEMP/data/gal"
          node scripts/dev/make-gal-maid-fixture.mjs "$RUNNER_TEMP/data/gal"
          node scripts/dev/make-kamihime-fixture.mjs "$RUNNER_TEMP/data/gal"
          node scripts/dev/make-grenze-fixture.mjs "$RUNNER_TEMP/data/gal"
          node scripts/dev/make-tsk-fixture.mjs "$RUNNER_TEMP/data/gal"
          node scripts/dev/make-otogi-fixture.mjs "$RUNNER_TEMP/data/gal"
          ls -la "$RUNNER_TEMP/data/gal"

      - name: Start web (HTTP) and import the demos
        run: |
          set -e
          docker run -d --name copymanga-web \
            -p 8080:8080 \
            -e TAG_SCRIPTS_DIR=/opt/copymanga/tag-scripts \
            -v "$RUNNER_TEMP/data:/data" \
            "${{ inputs.image || 'ghcr.io/lgithubl/copymanga-downloader:vibe-test-20261008' }}"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 2
            if [ "$i" = 60 ]; then docker logs copymanga-web || true; exit 1; fi
          done
          # 导入：adapter、路径、game.id 是导入时自己填的；metadataActionIds=gal-layout 按 game.id 探测结构、写 config（含默认节点图）
          import_gal() {  # $1 = 目录名，$2 = profileOptions（JSON），$3 = 是否跑 gal-layout（1/0）
            local extra=()
            if [ "$3" = 1 ]; then extra=(-F metadataActionIds=gal-layout); fi
            curl -fsS -X POST "http://127.0.0.1:8080/api/library/items?type=gal" -F importProfile=gal-import -F "sourcePath=/data/gal/$1" -F "profileOptions=$2" "${extra[@]}" | head -c 200 || echo "$1 import failed"
            echo
          }
          import_gal 'UViewer演示' '{}' 0
          import_gal 'monmusu演示' '{"adapters":["renpy-monmusu"],"config":{"game":{"id":"monmusu"}}}' 1
          import_gal 'tenkeiprdx演示' '{"adapters":["tenkeiprdx-json"],"config":{"game":{"id":"tenkeiprdx"}}}' 1
          import_gal 'minashigo演示' '{"adapters":["renpy-minashigo"],"config":{"game":{"id":"minashigo"}}}' 1
          import_gal 'legeclo演示' '{"adapters":["renpy-legeclo"],"config":{"game":{"id":"legeclo"}}}' 1
          import_gal 'girlscreation演示' '{"adapters":["girlscreation-tag"],"config":{"game":{"id":"girlscreation"}}}' 1
          import_gal 'maid演示' '{"adapters":["girlscreation-tag"],"config":{"game":{"id":"girlscreation"}}}' 1
          import_gal 'kamihime演示' '{"adapters":["tyrano-ks"],"config":{"game":{"id":"kamihime"}}}' 1
          import_gal 'Grenze演示' '{"adapters":["grenze-xml"],"config":{"game":{"id":"grenze"}}}' 1
          import_gal 'tsk演示' '{"adapters":["utage-book"],"config":{"game":{"id":"tsk"}}}' 1
          import_gal 'Otogi演示' '{"adapters":["otogi-json"],"config":{"game":{"id":"otogi"}}}' 1
          curl -fsS -X POST http://127.0.0.1:8080/api/library/index/rebuild >/dev/null || true
          sleep 5
          # 冒烟：媒体库里要有这几个 Gal 条目，maid 演示的首页要有「表情」卡片
          ITEMS="$(curl -fsS 'http://127.0.0.1:8080/api/library/items?type=gal' || true)"
          echo "$ITEMS" | head -c 600; echo
          MAID_ID="$(node -e "const d=JSON.parse(process.argv[1]);const l=Array.isArray(d)?d:(d.items||[]);const m=l.find(x=>/maid/.test(x.title||x.sourceName||'')||/maid/.test(JSON.stringify(x.source||'')));console.log(m?m.itemId:'')" "$ITEMS" || true)"
          echo "maid itemId=$MAID_ID"
          if [ -n "$MAID_ID" ]; then
            # gal-layout 是导入后在后台跑的：等它把配置写好（最多 60 秒）再看首页有没有「表情」卡片
            OK=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:8080/api/library/items/gal/$MAID_ID/reader/main" 2>/dev/null | grep -q '"x:expr"'; then OK=1; break; fi
              sleep 2
            done
            if [ "$OK" = 1 ]; then echo "表情入口: OK"; else echo "表情入口: 没找到（首页没有 x:expr 卡片）"; docker logs --tail 80 copymanga-web || true; exit 1; fi
          else
            echo "没找到 maid 演示条目"; exit 1
          fi

      - name: Start authenticated proxy
        id: auth
        shell: bash
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          USERNAME="copymanga"
          PASSWORD="$DEMO_PASSWORD"
          # 可选密码：配了仓库 secret DEMO_PASSWORD 就要密码（并屏蔽日志）；没配就不设密码——站点只用于没有真实数据的测试，任何拿到 URL 的人都能访问。
          if [ -n "$PASSWORD" ]; then
            echo "::add-mask::$PASSWORD"
          else
            echo "未配置 DEMO_PASSWORD：演示站点不设密码（只有合成数据，没有真实内容）"
          fi
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          cat >/tmp/basic_proxy.py <<'PY'
          import base64
          import http.server
          import os
          import urllib.error
          import urllib.request

          TARGET = "http://127.0.0.1:8080"
          USERNAME = os.environ["BASIC_USER"]
          PASSWORD = os.environ.get("BASIC_PASS", "")
          EXPECTED = "Basic " + base64.b64encode(f"{USERNAME}:{PASSWORD}".encode()).decode()
          HOP_BY_HOP = {"connection", "keep-alive", "proxy-authenticate", "proxy-authorization", "te", "trailers", "transfer-encoding", "upgrade"}

          class Proxy(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def _unauthorized(self):
                  body = b"Authentication required\n"
                  self.send_response(401)
                  self.send_header("WWW-Authenticate", 'Basic realm="copymanga-web"')
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def _proxy(self):
                  if PASSWORD and self.headers.get("Authorization") != EXPECTED:
                      self._unauthorized()
                      return
                  length = int(self.headers.get("Content-Length") or 0)
                  body = self.rfile.read(length) if length else None
                  headers = {k: v for k, v in self.headers.items() if k.lower() not in HOP_BY_HOP and k.lower() != "host"}
                  headers.pop("Authorization", None)
                  req = urllib.request.Request(TARGET + self.path, data=body, headers=headers, method=self.command)
                  try:
                      with urllib.request.urlopen(req, timeout=600) as resp:
                          self.send_response(resp.status)
                          payload = resp.read()
                          for k, v in resp.headers.items():
                              if k.lower() not in HOP_BY_HOP and k.lower() != "content-length":
                                  self.send_header(k, v)
                          self.send_header("Content-Length", str(len(payload)))
                          self.end_headers()
                          self.wfile.write(payload)
                  except urllib.error.HTTPError as exc:
                      payload = exc.read()
                      self.send_response(exc.code)
                      for k, v in exc.headers.items():
                          if k.lower() not in HOP_BY_HOP and k.lower() != "content-length":
                              self.send_header(k, v)
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)

              def do_GET(self): self._proxy()
              def do_HEAD(self): self._proxy()
              def do_POST(self): self._proxy()
              def do_PUT(self): self._proxy()
              def do_PATCH(self): self._proxy()
              def do_DELETE(self): self._proxy()

          http.server.ThreadingHTTPServer(("127.0.0.1", 8090), Proxy).serve_forever()
          PY
          BASIC_USER="$USERNAME" BASIC_PASS="$PASSWORD" python3 /tmp/basic_proxy.py >/tmp/basic_proxy.log 2>&1 &
          echo $! >/tmp/basic_proxy.pid
          sleep 1
          if [ -n "$PASSWORD" ]; then
            curl -fsS -u "$USERNAME:$PASSWORD" http://127.0.0.1:8090/health >/dev/null
          else
            curl -fsS http://127.0.0.1:8090/health >/dev/null
          fi

      - name: Start Cloudflare quick tunnel
        id: tunnel
        shell: bash
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:8090 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          for i in $(seq 1 60); do
            URL="$(grep -oE 'https://[-a-zA-Z0-9.]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$URL" ]; then
              MINUTES="${{ inputs.minutes || '60' }}"
              if [ -z "$MINUTES" ]; then MINUTES="60"; fi
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              {
                echo "## Gal 演示 临时访问地址"
                echo
                echo "URL: $URL"
                echo
                echo "Username: \`${{ steps.auth.outputs.username }}\`（没配 DEMO_PASSWORD 就不需要密码）"
                echo
                echo "镜像：\`${{ inputs.image || 'ghcr.io/lgithubl/copymanga-downloader:vibe-test-20261008' }}\`"
                echo
                echo "这个 runner 会保持在线 ${MINUTES} 分钟（除非手动取消）。"
                echo
                echo "看点：maid演示 → 首页「表情」；maid演示 → fx_blend →「更多 → 混合模式」；各游戏演示的「更多」里有索引刷新、角色摆放、画面放大、表情…。"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Temporary URL::$URL"
              exit 0
            fi
            cat /tmp/cloudflared.log || true
            sleep 2
          done
          cat /tmp/cloudflared.log || true
          exit 1

      # job 要 sleep 几十分钟，期间日志不开放下载，所以把 URL 单独发成 commit 评论（和 archive-gallery-demo 一样）
      - name: Post connection info as a commit comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="Gal demo run: ${{ github.run_id }}
          URL: ${{ steps.tunnel.outputs.url }}
          Username: ${{ steps.auth.outputs.username }}
          Expires: runner stops after ${{ inputs.minutes || '60' }} minutes"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY" || true

      - name: Keep session alive
        run: |
          MINUTES="${{ inputs.minutes || '60' }}"
          if [ -z "$MINUTES" ]; then MINUTES="60"; fi
          echo "URL: ${{ steps.tunnel.outputs.url }}"
          echo "Keeping session alive for ${MINUTES} minutes..."
          sleep "$(( MINUTES * 60 ))"

      - name: Print logs
        if: always()
        run: |
          echo "::group::copymanga-web container log"
          docker logs --tail 300 copymanga-web 2>&1 || echo "(无)"
          echo "::endgroup::"
          echo "::group::basic_proxy.log"
          tail -c 5000 /tmp/basic_proxy.log 2>/dev/null || echo "(无)"
          echo "::endgroup::"
          echo "::group::cloudflared.log"
          tail -c 5000 /tmp/cloudflared.log 2>/dev/null || echo "(无)"
          echo "::endgroup::"
