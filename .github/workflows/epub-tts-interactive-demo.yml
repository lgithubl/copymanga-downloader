name: EPUB Real TTS Interactive Demo

# 和 interactive-web-image.yml 分开一个新文件：之前想把"真实 GSV-TTS-Lite +
# 隧道"都塞进那个已经很大的文件，结果 ${{ }} 表达式总长度撑过了 GitHub
# Actions 21000 字符的硬限制，dispatch 直接 422。这个文件只做一件事：真实
# TTS + copymanga-web 一起起来，自测通过后再把可访问 URL 交出去。
on:
  workflow_dispatch:
    inputs:
      image:
        description: copymanga-downloader 镜像
        required: true
        default: ghcr.io/lgithubl/copymanga-downloader:web
      minutes:
        description: 保持在线的分钟数
        required: true
        default: "60"

permissions:
  contents: write
  packages: read

jobs:
  demo:
    name: Real TTS + copymanga-web interactive demo
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull copymanga-web image
        run: docker pull "${{ inputs.image }}"

      # disable-auto-download 分支的 docker/web_app.py 才是用户实际 Docker
      # 部署真正跑的那份代码（Dockerfile.web 的 CMD 是
      # uvicorn docker.web_app:app），不是 API/personal_api.py——两者接口形状
      # 现在看起来一致，但为了真正验证"用户的真实部署能不能用"，这里原样照
      # Dockerfile.web 的装法来，只是把 CUDA 轮子换成 CPU 轮子（runner 没有 GPU）。
      - name: Set up real GSV-TTS-Lite (disable-auto-download branch)
        run: |
          set -e
          git clone --depth 1 --branch disable-auto-download https://github.com/lgithubl/GSV-TTS-Lite.git "$RUNNER_TEMP/gsv-tts-lite"
          cd "$RUNNER_TEMP/gsv-tts-lite"
          python3 -m pip --version
          which python3
          which pip
          python3 -m pip install --quiet torch torchaudio
          python3 -m pip install --quiet fastapi "uvicorn[standard]"
          # 排查记录：先是 pip install . 报成功但 av 实际装不上
          # （ModuleNotFoundError: No module named 'av'），补装 av 后又变成
          # numpy 同样的情况——确认 pip 和 python3 是绑定同一个解释器
          # （/usr/bin/pip 和 /usr/bin/python3，都是 python 3.10，不是环境
          # 不一致的问题）。说明 pip install . 解析 pyproject.toml 里的
          # dependencies 时，会把其中一部分"判断成已满足"从而跳过真正安装
          # （Ubuntu 这台 runner 上大概率是被某些 apt 自带的同名包的 egg-info
          # 影响了判断）。干脆把 pyproject.toml 列出的运行时依赖全部显式
          # --force-reinstall 装一遍，不依赖 pip install . 自己去解析。
          # 注意：这里不能带 --no-deps——上一次带了，transformers 自己的
          # 传递依赖（regex 等）就没装上，同样的 ModuleNotFoundError 又犯了
          # 一遍，只是换了个包名。
          python3 -m pip install --quiet --force-reinstall \
            einops tqdm transformers sounddevice safetensors numpy \
            py3langid pysbd onnxruntime soundfile requests nltk future \
            inflect wordsegment pypinyin jieba pyopenjtalk-plus
          python3 -m pip install --quiet --force-reinstall --only-binary=:all: av
          python3 -m pip install --quiet --no-deps .
          # 上次跑的时候，/tts/batched 请求返回了 500，FastAPI 把真实的导入异常
          # 吞成了一句写死的提示（"Unable to import gsv_tts..."），看不到根因。
          # 这里装完包立刻单独验证一次 import，失败就直接把完整 traceback 打出来
          # 并让这一步 fail，而不是等到真的发 TTS 请求时才发现、还看不清原因。
          python3 -c "from gsv_tts import TTS; print('gsv_tts import OK')"
          mkdir -p "$RUNNER_TEMP/gsv-models" "$RUNNER_TEMP/gsv-refs" "$RUNNER_TEMP/gsv-outputs"
          # 上次跑起来之后用户把 copymanga 这边的 speaker_audio/prompt_audio
          # 留空测试"交给服务端默认值兜底"这条新路径，结果 400：
          # speaker_audio not found: /refs/speaker.wav——因为这里从没配过
          # DEFAULT_SPEAKER_AUDIO/DEFAULT_PROMPT_AUDIO，docker/web_app.py
          # 落回去用的是它自己硬编码的 /refs/speaker.wav，这台 runner 上根本
          # 没这个文件。参考 GSV-TTS-Lite 自己 build-model-artifacts.yml 的
          # 参考音频，这里也配上。
          cp "$RUNNER_TEMP/gsv-tts-lite/examples/laffey.mp3" "$RUNNER_TEMP/gsv-refs/speaker.mp3"
          cp "$RUNNER_TEMP/gsv-tts-lite/examples/AnAn.ogg" "$RUNNER_TEMP/gsv-refs/prompt.ogg"
          PORT=9880 \
          MODELS_DIR="$RUNNER_TEMP/gsv-models" \
          REFS_DIR="$RUNNER_TEMP/gsv-refs" \
          OUTPUTS_DIR="$RUNNER_TEMP/gsv-outputs" \
          DEFAULT_SPEAKER_AUDIO="$RUNNER_TEMP/gsv-refs/speaker.mp3" \
          DEFAULT_PROMPT_AUDIO="$RUNNER_TEMP/gsv-refs/prompt.ogg" \
          DEFAULT_PROMPT_TEXT="参考音频占位文本，仅用于验证朗读链路" \
          GSV_TTS_AUTO_DOWNLOAD=true \
          GSV_TTS_USE_BERT=false \
          GSV_TTS_USE_FLASH_ATTN=false \
          nohup python3 -m uvicorn docker.web_app:app --host 0.0.0.0 --port 9880 \
            > "$RUNNER_TEMP/gsv-tts-lite.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9880/health >/dev/null 2>&1 && exit 0
            sleep 5
          done
          echo "GSV-TTS-Lite 没在 5 分钟内就绪，看日志："
          cat "$RUNNER_TEMP/gsv-tts-lite.log" || true
          exit 1

      - name: Start copymanga-web pointed at real TTS
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          # 故意留空 speaker/prompt_audio/prompt_text——这是用户刚发现的那个
          # 场景（留空交给服务端 DEFAULT_SPEAKER_AUDIO 等环境变量兜底），
          # 得验证这条路径真的通，不是只测"显式传路径"那条本来就没问题的路径。
          cat > "$RUNNER_TEMP/data/config.json" <<JSON
          {
            "epubTtsApiBase": "http://host.docker.internal:9880",
            "epubTtsSpeakerAudio": "",
            "epubTtsPromptAudio": "",
            "epubTtsPromptText": "",
            "epubTtsMaxConcurrency": 1
          }
          JSON
          docker run -d --name copymanga-web \
            --add-host host.docker.internal:host-gateway \
            -p 8080:8080 \
            -v "$RUNNER_TEMP/data:/data" \
            "${{ inputs.image }}"
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs copymanga-web || true
          exit 1

      # CPU 推理很慢，超时给够 10 分钟，测试文本尽量短。这步过不了就直接
      # 失败退出，不会把一个连 TTS 都跑不通的 URL 交给用户。
      - name: Real TTS smoke test before handing over the URL
        run: |
          ITEM_ID="$(curl -fsS -X POST 'http://127.0.0.1:8080/api/library/items/sample?type=epub' | python3 -c 'import json,sys; print(json.load(sys.stdin)["itemId"])')"
          echo "sample itemId=$ITEM_ID"
          START=$(date +%s)
          RESP="$(curl -fsS --max-time 600 -X POST "http://127.0.0.1:8080/api/epub/$ITEM_ID/tts-chunk" \
            -H "Content-Type: application/json" \
            -d '{"texts":["你好"]}')"
          END=$(date +%s)
          echo "耗时 $((END - START)) 秒：$RESP"
          URL="$(echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["chunks"][0].get("url",""))')"
          if [ -z "$URL" ]; then
            echo "真实 TTS 测试失败，没拿到音频 url"
            exit 1
          fi
          curl -fsS "http://127.0.0.1:8080$URL" -o "$RUNNER_TEMP/real-tts-chunk.wav"
          SIZE="$(stat -c %s "$RUNNER_TEMP/real-tts-chunk.wav")"
          file "$RUNNER_TEMP/real-tts-chunk.wav"
          if [ "$SIZE" -lt 1000 ]; then
            echo "音频文件太小（$SIZE 字节），不像真的生成了"
            exit 1
          fi
          {
            echo "## 真实 TTS 自测：通过"
            echo
            echo "耗时 $((END - START)) 秒，音频大小 $SIZE 字节"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start authenticated proxy
        id: auth
        shell: bash
        run: |
          USERNAME="copymanga"
          PASSWORD="$(openssl rand -base64 18 | tr -d '=+/')"
          {
            echo "username=$USERNAME"
            echo "password=$PASSWORD"
          } >> "$GITHUB_OUTPUT"
          cat >/tmp/basic_proxy.py <<'PY'
          import base64
          import http.server
          import os
          import urllib.error
          import urllib.request

          TARGET = "http://127.0.0.1:8080"
          USERNAME = os.environ["BASIC_USER"]
          PASSWORD = os.environ["BASIC_PASS"]
          EXPECTED = "Basic " + base64.b64encode(f"{USERNAME}:{PASSWORD}".encode()).decode()
          HOP_BY_HOP = {"connection", "keep-alive", "proxy-authenticate", "proxy-authorization", "te", "trailers", "transfer-encoding", "upgrade"}

          class Proxy(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def _unauthorized(self):
                  body = b"Authentication required\n"
                  self.send_response(401)
                  self.send_header("WWW-Authenticate", 'Basic realm="copymanga-web"')
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def _proxy(self):
                  if self.headers.get("Authorization") != EXPECTED:
                      self._unauthorized()
                      return
                  length = int(self.headers.get("Content-Length") or 0)
                  body = self.rfile.read(length) if length else None
                  headers = {
                      k: v for k, v in self.headers.items()
                      if k.lower() not in HOP_BY_HOP and k.lower() != "host"
                  }
                  headers.pop("Authorization", None)
                  req = urllib.request.Request(
                      TARGET + self.path,
                      data=body,
                      headers=headers,
                      method=self.command,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=600) as resp:
                          self.send_response(resp.status)
                          payload = resp.read()
                          for k, v in resp.headers.items():
                              if k.lower() not in HOP_BY_HOP and k.lower() != "content-length":
                                  self.send_header(k, v)
                          self.send_header("Content-Length", str(len(payload)))
                          self.end_headers()
                          self.wfile.write(payload)
                  except urllib.error.HTTPError as exc:
                      payload = exc.read()
                      self.send_response(exc.code)
                      for k, v in exc.headers.items():
                          if k.lower() not in HOP_BY_HOP and k.lower() != "content-length":
                              self.send_header(k, v)
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)

              def do_GET(self): self._proxy()
              def do_HEAD(self): self._proxy()
              def do_POST(self): self._proxy()
              def do_PUT(self): self._proxy()
              def do_PATCH(self): self._proxy()
              def do_DELETE(self): self._proxy()

          http.server.ThreadingHTTPServer(("127.0.0.1", 8090), Proxy).serve_forever()
          PY
          BASIC_USER="$USERNAME" BASIC_PASS="$PASSWORD" python /tmp/basic_proxy.py >/tmp/basic_proxy.log 2>&1 &
          echo $! >/tmp/basic_proxy.pid
          sleep 1
          curl -fsS -u "$USERNAME:$PASSWORD" http://127.0.0.1:8090/health >/dev/null

      - name: Start Cloudflare quick tunnel
        id: tunnel
        shell: bash
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:8090 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          for i in $(seq 1 60); do
            URL="$(grep -oE 'https://[-a-zA-Z0-9.]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$URL" ]; then
              MINUTES="${{ inputs.minutes }}"
              if [ -z "$MINUTES" ]; then MINUTES="60"; fi
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              {
                echo "## 真实 TTS + copymanga-web 临时访问地址"
                echo
                echo "URL: $URL"
                echo
                echo "Username: \`${{ steps.auth.outputs.username }}\`"
                echo
                echo "Password: \`${{ steps.auth.outputs.password }}\`"
                echo
                echo "这个 runner 会保持在线 ${MINUTES} 分钟（除非手动取消）。"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Temporary URL::$URL"
              exit 0
            fi
            cat /tmp/cloudflared.log || true
            sleep 2
          done
          cat /tmp/cloudflared.log || true
          exit 1

      # 这一步存在的理由：Keep session alive 那一步要 sleep 几十分钟，整个
      # job 在这期间一直是 in_progress 状态，而 GitHub 只有 job 真正结束后
      # 才会把日志打包开放下载（gh run view --log 对 in_progress 的 run
      # 直接拒绝："logs will be available when it is complete"）。不把 URL/
      # 账号密码单独发出来，我在隧道还活着的这几十分钟里根本没法拿到它们。
      - name: Post connection info as a commit comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="Run: ${{ github.run_id }}
          URL: ${{ steps.tunnel.outputs.url }}
          Username: ${{ steps.auth.outputs.username }}
          Password: ${{ steps.auth.outputs.password }}
          Expires: runner stops after ${{ inputs.minutes }} minutes"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY" || true

      - name: Keep session alive
        run: |
          MINUTES="${{ inputs.minutes }}"
          if [ -z "$MINUTES" ]; then MINUTES="60"; fi
          echo "URL: ${{ steps.tunnel.outputs.url }}"
          echo "Username: ${{ steps.auth.outputs.username }}"
          echo "Password: ${{ steps.auth.outputs.password }}"
          echo "Keeping session alive for ${MINUTES} minutes..."
          sleep "$(( MINUTES * 60 ))"

      # 直接打印到 job 日志里，不走 actions/upload-artifact——这个仓库的 Actions
      # 存储配额已经被 Actions artifacts + ghcr 镜像一起吃满过一次（上次 build
      # image 那边改成发 Release 解决的），这个 workflow 只是临时调试用，没必要
      # 占用同一份配额，直接 cat 到日志里反而更方便看、也不用等上传。
      - name: Print logs
        if: always()
        run: |
          echo "::group::gsv-tts-lite.log"
          tail -c 20000 "$RUNNER_TEMP/gsv-tts-lite.log" 2>/dev/null || echo "(无)"
          echo "::endgroup::"
          echo "::group::copymanga-web container log"
          docker logs --tail 300 copymanga-web 2>&1 || echo "(无)"
          echo "::endgroup::"
          echo "::group::basic_proxy.log"
          tail -c 5000 /tmp/basic_proxy.log 2>/dev/null || echo "(无)"
          echo "::endgroup::"
          echo "::group::cloudflared.log"
          tail -c 5000 /tmp/cloudflared.log 2>/dev/null || echo "(无)"
          echo "::endgroup::"
