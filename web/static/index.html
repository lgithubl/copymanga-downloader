<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拷贝漫画下载器 Web</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="app">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h1>拷贝漫画下载器</h1>
          <button id="sidebar-toggle" class="secondary" title="收缩任务栏">‹</button>
        </div>
        <label class="sidebar-auth">
          Token
          <textarea id="token" rows="4" placeholder="登录后自动填入，也可以手动粘贴"></textarea>
        </label>
        <div class="login-grid sidebar-auth">
          <input id="username" autocomplete="username" placeholder="账号" />
          <input id="password" autocomplete="current-password" type="password" placeholder="密码" />
          <button id="login">登录</button>
        </div>
        <section>
          <div class="task-head">
            <h2>下载任务</h2>
            <button id="retry-failed" class="secondary">批量继续</button>
            <button id="clear-active" class="danger">批量清理</button>
          </div>
          <div id="jobs" class="jobs"></div>
        </section>
      </aside>

      <section class="content">
        <nav class="tabs">
          <button class="tab active" data-view="search-view">漫画搜索</button>
          <button class="tab" data-view="discover-view">发现</button>
          <button class="tab" data-view="favorite-view">漫画收藏</button>
          <button class="tab" data-view="downloaded-view">本地库存</button>
          <button class="tab" data-view="viewer-view">图片浏览</button>
          <button class="tab" data-view="settings-view">配置</button>
        </nav>
        <div class="toolbar">
          <input id="keyword" placeholder="搜索漫画" />
          <button id="search">搜索</button>
        </div>
        <div id="search-view" class="workspace view active">
          <section>
            <h2>搜索结果</h2>
            <div id="results" class="cards"></div>
          </section>
          <section class="chapter-panel">
            <div class="chapter-head">
              <h2 id="comic-title">章节</h2>
              <div class="chapter-actions">
                <button id="download-all" class="secondary" disabled>下载全量</button>
                <button id="download" disabled>下载勾选章节</button>
              </div>
            </div>
            <div id="chapters" class="chapters"></div>
          </section>
        </div>
        <div id="discover-view" class="workspace view">
          <section>
            <div class="discover-panel">
              <div class="chapter-head">
                <h2>发现</h2>
                <div class="pager">
                  <button id="discover-refresh">刷新</button>
                  <button id="discover-prev" class="secondary" disabled>上一页</button>
                  <label class="page-jump">
                    <span>第</span>
                    <input id="discover-page" type="number" min="1" value="1" />
                    <span id="discover-page-total">/ 1 页</span>
                  </label>
                  <button id="discover-jump" class="secondary">跳转</button>
                  <button id="discover-next" class="secondary" disabled>下一页</button>
                </div>
              </div>
              <div class="filters">
                <label>排序
                  <select id="discover-ordering">
                    <option value="-datetime_updated">更新时间 ↓</option>
                    <option value="datetime_updated">更新时间 ↑</option>
                    <option value="-popular">热度 ↓</option>
                  </select>
                </label>
                <label>题材
                  <select id="discover-theme">
                    <option value="">不限</option>
                    <option value="aiqing">爱情</option>
                    <option value="huanlexiang">欢乐向</option>
                    <option value="maoxian">冒险</option>
                    <option value="qihuan">奇幻</option>
                    <option value="baihe">百合</option>
                    <option value="xiaoyuan">校园</option>
                    <option value="kehuan">科幻</option>
                    <option value="dongfang">东方</option>
                    <option value="danmei">耽美</option>
                    <option value="shenghuo">生活</option>
                    <option value="gedou">格斗</option>
                    <option value="xuanyi">悬疑</option>
                    <option value="teenslove">TL</option>
                    <option value="zhichang">职场</option>
                    <option value="zhiyu">治愈</option>
                    <option value="gaoxiao">搞笑</option>
                    <option value="mohuan">魔幻</option>
                    <option value="rexue">热血</option>
                    <option value="hougong">后宫</option>
                    <option value="zhentan">侦探</option>
                    <option value="jingsong">惊悚</option>
                    <option value="yishijie">异世界</option>
                    <option value="zhanzheng">战争</option>
                    <option value="lishi">历史</option>
                    <option value="dushi">都市</option>
                    <option value="chuanyue">穿越</option>
                    <option value="chongsheng">重生</option>
                    <option value="kongbu">恐怖</option>
                    <option value="shengcun">生存</option>
                    <option value="wuxia">武侠</option>
                    <option value="zhuansheng">转生</option>
                    <option value="fate">Fate</option>
                    <option value="xianxia">仙侠</option>
                  </select>
                </label>
                <label>地区
                  <select id="discover-region">
                    <option value="">不限</option>
                    <option value="0">日本</option>
                    <option value="1">韩国</option>
                    <option value="2">欧美</option>
                  </select>
                </label>
                <label>状态
                  <select id="discover-status">
                    <option value="">不限</option>
                    <option value="0">连载中</option>
                    <option value="1">已完结</option>
                    <option value="2">短篇</option>
                  </select>
                </label>
                <label>每页
                  <select id="discover-limit">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                  </select>
                </label>
              </div>
              <div id="discover-meta" class="muted"></div>
              <div id="discover-results" class="cards"></div>
            </div>
          </section>
          <section class="chapter-panel">
            <div class="chapter-head">
              <h2 id="discover-comic-title">章节</h2>
              <div class="chapter-actions">
                <button id="discover-download-all" class="secondary" disabled>下载全量</button>
                <button id="discover-download" disabled>下载勾选章节</button>
              </div>
            </div>
            <div id="discover-chapters" class="chapters"></div>
          </section>
        </div>
        <div id="favorite-view" class="workspace view">
          <section>
            <div class="chapter-head">
              <h2>漫画收藏</h2>
              <select id="favorite-ordering">
                <option value="Added">加到书架时间</option>
                <option value="Updated">作品更新时间</option>
                <option value="Read">上次阅读时间</option>
              </select>
              <button id="favorite-refresh">刷新</button>
            </div>
            <div id="favorites" class="cards"></div>
          </section>
          <section>
            <h2>收藏说明</h2>
            <div class="empty-panel">点击收藏里的漫画会回到章节列表。</div>
          </section>
        </div>
        <div id="downloaded-view" class="workspace view">
          <section>
            <div class="chapter-head">
              <h2>本地库存</h2>
              <div class="chapter-actions">
                <select id="downloaded-update-scope">
                  <option value="downloadedGroups">仅已下载分组</option>
                  <option value="allGroups">全部分组</option>
                </select>
                <button id="downloaded-update" class="secondary">更新库存</button>
                <button id="downloaded-refresh">刷新</button>
              </div>
            </div>
            <div id="inventory-progress" class="inventory-progress hidden">
              <div class="inventory-progress-text">更新库存</div>
              <div class="bar"><span id="inventory-progress-bar"></span></div>
            </div>
            <div class="pager inventory-pager">
              <button id="downloaded-prev" class="secondary" disabled>上一页</button>
              <label class="page-jump">
                <span>第</span>
                <input id="downloaded-page" type="number" min="1" value="1" />
                <span id="downloaded-page-total">/ 1 页</span>
              </label>
              <button id="downloaded-jump" class="secondary">跳转</button>
              <button id="downloaded-next" class="secondary" disabled>下一页</button>
              <select id="downloaded-limit">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
              </select>
            </div>
            <div id="downloaded" class="cards"></div>
          </section>
          <section>
            <div class="chapter-head">
              <div>
                <h2 id="downloaded-comic-title">库存章节</h2>
                <div id="downloaded-comic-meta" class="muted">请选择本地库存</div>
              </div>
              <div class="chapter-actions">
                <button id="downloaded-comic-refresh" class="secondary" disabled>刷新章节</button>
              </div>
            </div>
            <div id="downloaded-chapters" class="chapters empty-panel">请选择本地库存</div>
          </section>
        </div>
        <div id="viewer-view" class="viewer-view view">
          <section>
            <div class="chapter-head">
              <div>
                <h2 id="viewer-title">图片浏览</h2>
                <div id="viewer-meta" class="muted">请选择一个章节</div>
              </div>
              <div class="chapter-actions">
                <button id="viewer-refresh" class="secondary" disabled>刷新</button>
              </div>
            </div>
            <div id="viewer-images" class="viewer-grid empty-panel">请选择一个章节</div>
          </section>
        </div>
        <div id="settings-view" class="workspace view">
          <section>
            <div class="chapter-head">
              <h2>配置</h2>
              <button id="config-save">保存配置</button>
            </div>
            <div class="settings-panel">
              <h3>下载相关</h3>
              <label>下载目录<input id="config-download-dir" readonly /></label>
              <label>元数据目录<input id="config-metadata-dir" placeholder="为空时跟随下载目录" /></label>
              <label>图片下载格式
                <select id="config-download-format">
                  <option value="Webp">webp</option>
                  <option value="Jpeg">jpg</option>
                </select>
              </label>
              <label class="checkbox-line"><input id="config-enable-picked-sync-guard" type="checkbox" />保护详情页同步</label>
              <label>漫画目录格式<input id="config-comic-dir-fmt" /></label>
              <label>章节目录格式<input id="config-chapter-dir-fmt" /></label>

              <h3>网络相关</h3>
              <label>Token<textarea id="config-token" rows="3"></textarea></label>
              <label>API 域名模式
                <select id="config-api-domain-mode">
                  <option value="Default">默认</option>
                  <option value="Custom">自定义</option>
                </select>
              </label>
              <label>自定义 API 域名<input id="config-custom-api-domain" placeholder="api.copy202601.com" /></label>
              <label class="checkbox-line"><input id="config-enable-file-logger" type="checkbox" />输出文件日志</label>
              <label>章节并发<input id="config-chapter-concurrency" type="number" min="1" max="30" step="1" /></label>
              <label>每个章节下载完成后休息<input id="config-chapter-download-interval-sec" type="number" min="0" step="1" /></label>
              <label>图片并发<input id="config-img-concurrency" type="number" min="1" max="60" step="1" /></label>
              <label>每张图片下载完成后休息<input id="config-img-download-interval-sec" type="number" min="0" step="1" /></label>
              <label>浏览图片批量加载<input id="config-viewer-image-batch-size" type="number" min="1" max="50" step="1" /></label>
              <label>更新库存处理间隔<input id="config-update-downloaded-comics-interval-sec" type="number" min="0" step="1" /></label>

              <h3>导出相关</h3>
              <label>导出目录<input id="config-export-dir" /></label>
              <label>导出目录格式<input id="config-export-dir-fmt" /></label>
              <label>合并 PDF 目录格式<input id="config-merge-pdf-fmt" /></label>
              <label>创建 PDF 并发<input id="config-create-pdf-concurrency" type="number" min="1" max="30" step="1" /></label>
              <label class="checkbox-line"><input id="config-enable-merge-pdf" type="checkbox" />创建完成后自动合并</label>
              <label>导出策略
                <select id="config-export-skip-mode">
                  <option value="None">不跳过，每次重新导出</option>
                  <option value="SkipExisting">跳过已存在文件</option>
                  <option value="SkipExported">跳过曾导出过的章节</option>
                </select>
              </label>
            </div>
          </section>
          <section>
            <h2>说明</h2>
            <div class="empty-panel">配置保存到容器 /data/config.json。下载目录由容器挂载决定。</div>
          </section>
        </div>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
